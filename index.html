<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashish | Software Engineer</title>
    
    <style>
        #film-grain {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 500;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }
        :root {
            --ui-color: rgba(255, 255, 255, 0.4);
            --ui-hover: rgba(255, 255, 255, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none; 
        }

        #hud-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
        }

        .hud-top, .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-branding {
            color: var(--ui-hover);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .hud-role {
            color: var(--ui-color);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-btn {
            pointer-events: auto;
            background: none;
            border: 1px solid var(--ui-color);
            color: var(--ui-color);
            font-size: 10px;
            letter-spacing: 2px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .hud-btn:hover {
            color: var(--ui-hover);
            border-color: var(--ui-hover);
        }

        #audio-toggle {
            position: relative;
        }

        @media (max-width: 768px) {
            #hud-container { padding: 20px; }
            .hud-branding { font-size: 12px; }
            .hud-role { display: none; }
        }
    </style>
</head>
<body>
    <div id="film-grain"></div>
    <div id="hud-container">
        <div class="hud-top">
            <div class="hud-branding">ASHISH</div>
            <div class="hud-role">SOFTWARE ENGINEER</div>
        </div>
        <div class="hud-bottom">
            <div class="hud-coordinates" style="color: var(--ui-color); font-size: 10px; font-family: monospace;">SYS_ONLINE</div>
            <button id="audio-toggle" class="hud-btn">SOUND: OFF</button>
        </div>
    </div>

    <script type="module">
        import { App } from './src/3d/app.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            window.portfolioApp = new App();
        });
    </script>
</body>
</html>
